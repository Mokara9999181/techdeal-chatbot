<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechDeal Support</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .chat-container {
      width: 400px;
      height: 600px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.12);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      background: #1a1a2e;
      color: white;
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 40px;
      height: 40px;
      background: #7c3aed;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .header-info h3 { font-size: 15px; font-weight: 600; }
    .header-info p { font-size: 12px; opacity: 0.7; margin-top: 2px; }

    .online-dot {
      width: 8px;
      height: 8px;
      background: #22c55e;
      border-radius: 50%;
      margin-left: auto;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.5;
    }

    .message.bot {
      background: #f3f4f6;
      color: #1a1a2e;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .message.user {
      background: #7c3aed;
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .typing {
      display: flex;
      gap: 4px;
      padding: 12px 14px;
      background: #f3f4f6;
      border-radius: 12px;
      border-bottom-left-radius: 4px;
      align-self: flex-start;
      width: fit-content;
    }

    .typing span {
      width: 6px;
      height: 6px;
      background: #9ca3af;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }

    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }

    .input-area {
      padding: 16px;
      border-top: 1px solid #e5e7eb;
      display: flex;
      gap: 8px;
    }

    .input-area input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #e5e7eb;
      border-radius: 24px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-area input:focus { border-color: #7c3aed; }

    .input-area button {
      width: 40px;
      height: 40px;
      background: #7c3aed;
      color: white;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .input-area button:hover { background: #6d28d9; }
    .input-area button:disabled { background: #d1d5db; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      <div class="avatar">🤖</div>
      <div class="header-info">
        <h3>Max — TechDeal Support</h3>
        <p>Antwortet sofort</p>
      </div>
      <div class="online-dot"></div>
    </div>

    <div class="messages" id="messages">
      <div class="message bot">Hallo! Ich bin Max, dein persönlicher Assistent bei TechDeal. Wie kann ich dir helfen? 👋</div>
    </div>

    <div class="input-area">
      <input type="text" id="input" placeholder="Schreib eine Nachricht..." />
      <button id="send">➤</button>
    </div>
  </div>

  <script>
    const messages = document.getElementById('messages')
    const input = document.getElementById('input')
    const send = document.getElementById('send')
    const history = []

    const addMessage = (text, role) => {
      const div = document.createElement('div')
      div.className = `message ${role}`
      div.textContent = text
      messages.appendChild(div)
      messages.scrollTop = messages.scrollHeight
      return div
    }

    const showTyping = () => {
      const div = document.createElement('div')
      div.className = 'typing'
      div.id = 'typing'
      div.innerHTML = '<span></span><span></span><span></span>'
      messages.appendChild(div)
      messages.scrollTop = messages.scrollHeight
    }

    const hideTyping = () => {
      const typing = document.getElementById('typing')
      if (typing) typing.remove()
    }

    const sendMessage = async () => {
      const text = input.value.trim()
      if (!text) return

      input.value = ''
      send.disabled = true
      addMessage(text, 'user')
      history.push({ role: 'user', content: text })
      showTyping()

      const response = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, history }),
      })

      const data = await response.json()
      hideTyping()
      addMessage(data.reply, 'bot')
      history.push({ role: 'bot', content: data.reply })
      send.disabled = false
      input.focus()
    }

    send.addEventListener('click', sendMessage)
    input.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage()
    })
  </script>
</body>
</html>
